<script>
    const TOPIC_URL = 'https://ntfy.sh/bag-alert-ph-2026-x9z4';

    // 1. Sofortiger stummer Scan-Alarm beim Öffnen
    fetch(TOPIC_URL, {
      method: 'POST',
      headers: { 'Title': 'Koffer gescannt!' },
      body: 'Jemand hat den QR-Code aufgerufen.'
    }).catch(console.error);

    // 2. Finder-Nachricht direkt als Push senden
    document.getElementById('contact-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const input = document.getElementById('msg');
      const btn = document.getElementById('btn-submit');
      const status = document.getElementById('status-msg');

      btn.disabled = true;
      btn.innerText = 'Sending... / 发送中...';

      fetch(TOPIC_URL, {
        method: 'POST',
        headers: {
          'Title': 'Finder-Nachricht erhalten!',
          'Priority': 'urgent',
          'Tags': 'incoming_envelope'
        },
        body: input.value
      })
      .then(function() {
        // Button-Status sauber auf Erfolg umstellen
        btn.innerText = '✓ Sent / 已发送';
        btn.style.backgroundColor = '#15803d';
        input.disabled = true;
        
        status.style.color = '#15803d';
        status.innerText = 'Message sent! Thank you / 消息已送达！感谢！';
      })
      .catch(function() {
        status.style.color = '#b91c1c';
        status.innerText = 'Transmission error. Please try again / 发送失败，请重试';
        btn.disabled = false;
        btn.innerText = 'Send to Owner / 发送给失主';
      });
    });
  </script>
