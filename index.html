<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baggage Contact / 行李失主联络</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f4f7;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      max-width: 420px;
      width: 100%;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      border: 1px solid #e2e8f0;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 6px 0;
    }
    p {
      font-size: 14px;
      color: #64748b;
      margin: 0 0 20px 0;
      line-height: 1.4;
    }
    .alert-banner {
      background-color: #f0fdf4;
      border-left: 4px solid #22c55e;
      padding: 10px 12px;
      font-size: 13px;
      color: #15803d;
      margin-bottom: 20px;
      border-radius: 0 6px 6px 0;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #334155;
    }
    textarea {
      width: 100%;
      height: 110px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      margin-bottom: 14px;
    }
    textarea:focus {
      outline: none;
      border-color: #0284c7;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: #0284c7;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    #status-msg {
      margin-top: 14px;
      font-size: 13px;
      text-align: center;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Lost Baggage / 遗失行李</h1>
    <p>You found my luggage! Leave a message or contact info so we can meet.<br>
    您找到了我的行李！请留下联系方式或位置。</p>

    <div class="alert-banner">
      Owner automatically alerted via scan.<br>
      失主已收到自动扫码定位提醒。
    </div>

    <form id="contact-form">
      <label for="msg">Message / 留言 / 电话 / 位置:</label>
      <textarea id="msg" placeholder="e.g. Left at Terminal 2 Lost & Found / 或留下您的微信/电话..." required></textarea>
      <button type="submit" id="btn-submit">Send to Owner / 发送给失主</button>
    </form>

    <div id="status-msg"></div>
  </div>

  <script>
    const TOPIC_URL = 'https://ntfy.sh/bag-alert-ph-2026-x9z4';

    // 1. Sofortiger stummer Scan-Alarm beim Öffnen
    fetch(TOPIC_URL, {
      method: 'POST',
      headers: { 'Title': 'Koffer gescannt!' },
      body: 'Jemand hat den QR-Code aufgerufen.'
    }).catch(console.error);

    // 2. Finder-Nachricht direkt als Push senden
    document.getElementById('contact-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const input = document.getElementById('msg');
      const btn = document.getElementById('btn-submit');
      const status = document.getElementById('status-msg');

      btn.disabled = true;
      btn.innerText = 'Sending... / 发送中...';

      fetch(TOPIC_URL, {
        method: 'POST',
        headers: {
          'Title': 'Finder-Nachricht erhalten!',
          'Priority': 'urgent',
          'Tags': 'incoming_envelope'
        },
        body: input.value
      })
      .then(function() {
        status.style.color = '#15803d';
        status.innerText = '✓ Message sent! Thank you / 消息已送达！感谢！';
        input.value = '';
      })
      .catch(function() {
        status.style.color = '#b91c1c';
        status.innerText = 'Transmission error. Please try again / 发送失败，请重试';
        btn.disabled = false;
        btn.innerText = 'Send to Owner / 发送给失主';
      });
    });
  </script>

</body>
</html>
